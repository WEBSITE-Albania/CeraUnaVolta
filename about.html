<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rreth nesh | C’era Una Volta</title>
  <meta name="description" content="C’era Una Volta – pub &amp; bar në Pazarin e Vjetër të Korçës. Saimir Poda dhe grupi i tij luajnë live çdo fundjavë.">
  <meta name="theme-color" content="#121110">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Jost:wght@300..500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="about" data-title-key="about.title">

  <main id="main">

    <header class="page-hero">
      <div class="container">
        <h1 class="page-hero__title" data-i18n="about.title">Rreth nesh</h1>
        <p class="page-hero__subtitle" data-i18n="about.subtitle">Një bar, një skenë dhe shumë histori</p>
      </div>
    </header>

    <section class="section" aria-labelledby="about-heading">
      <div class="container about">
        <div class="about__text">
          <h2 class="h-section" id="about-heading" data-i18n="about.heading">Na ishte një herë…</h2>
          <p data-i18n="about.p1"></p>
          <p data-i18n="about.p2"></p>
          <p data-i18n="about.p3"></p>
          <div class="btn-row">
            <a class="btn btn--solid" href="menu.html" data-i18n="about.cta">Shiko menunë</a>
          </div>
        </div>

        <!-- TEAM PHOTOS
             Save the photographs as:
               images/team/team-photo-1.jpg
               images/team/team-photo-2.jpg -->
        <div class="about__photos">
          <figure>
            <div class="ph ratio-4x5" data-img-host data-zoom>
              <img src="images/team/team-photo-1.jpeg" alt="" data-i18n-attr="alt:about.team1" loading="lazy">
            </div>
          </figure>
          <figure>
            <div class="ph ratio-4x5" data-img-host data-zoom>
              <img src="images/team/team-photo-2.jpeg" alt="" data-i18n-attr="alt:about.team2" loading="lazy">
            </div>
          </figure>
        </div>
      </div>
    </section>

  </main>

  <script src="js/translations.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="js/media.js" defer></script>
</body>
</html>
