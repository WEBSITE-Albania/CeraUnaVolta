<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kontakt | C’era Una Volta</title>
  <meta name="description" content="Kontakt: C’era Una Volta, Pazari i Vjetër, Korçë 7001. Tel. 069 543 5744, ceraunavoltakorce@gmail.com.">
  <meta name="theme-color" content="#121110">
  <link rel="icon" href="images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Jost:wght@300..500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="contact" data-title-key="contact.title">

  <main id="main">

    <header class="page-hero">
      <div class="container">
        <h1 class="page-hero__title" data-i18n="contact.title">Kontakt</h1>
        <p class="page-hero__subtitle" data-i18n="contact.subtitle">Na telefononi, na shkruani ose thjesht ejani</p>
      </div>
    </header>

    <section class="section" aria-labelledby="details-title">
      <div class="container contact">

        <div class="contact__details">
          <h2 class="h-display" id="details-title" data-i18n="contact.detailsTitle">Të gjitha rrugët të çojnë tek ne</h2>
        </div>

        <dl class="contact-list">
          <div class="contact-list__row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 3.5h3.5l1.7 4.3-2.2 1.4a11 11 0 0 0 6.8 6.8l1.4-2.2 4.3 1.7V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.1 1.5 1.5 0 0 1 5 3.5z"/></svg>
            <dt data-i18n="label.phone">Telefoni</dt>
            <dd><a href="tel:+355695435744" data-site-href="phone">069 543 5744</a></dd>
          </div>
          <div class="contact-list__row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3" y="5.5" width="18" height="13" rx="1.5"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>
            <dt data-i18n="label.email">Email</dt>
            <dd>ceraunavoltakorce@gmail.com</dd>
          </div>
          <div class="contact-list__row">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 21s-6.5-6.1-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.9 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></svg>
            <dt data-i18n="label.address">Adresa</dt>
            <dd><address><a href="https://www.google.com/maps?q=place_id:ChIJ6zDr0YgLWhMR49GI8yAOuvs" data-site-href="maps" target="_blank" rel="noopener noreferrer">Pazari i Vjetër, Korçë 7001, Shqipëri<span class="sr-only" data-i18n="label.newTab"></span></a></address></dd>
          </div>
        </dl>

      </div>
    </section>

    <section class="section follow" aria-labelledby="follow-title">
      <div class="container follow__grid">
        <div>
          <h2 class="h-display" id="follow-title" data-i18n="contact.followTitle">Na ndiqni</h2>
          <p data-i18n="contact.followText"></p>
        </div>
        <div class="follow__links">
          <a class="follow__link" href="https://www.instagram.com/c__era_una_volta/" data-site-href="instagram" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r=".9" fill="currentColor" stroke="none"/></svg>
            <span>
              <span class="follow__link-name" data-i18n="contact.followIg">Instagram</span>
              <span class="follow__link-handle">@c__era_una_volta</span>
            </span>
            <span class="sr-only" data-i18n="label.newTab"></span>
          </a>
          <a class="follow__link" href="https://www.facebook.com/nelondi/?locale=sq_AL" data-site-href="facebook" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M14 21v-7.5h2.6l.4-3H14V8.7c0-.9.3-1.5 1.6-1.5H17V4.5c-.3 0-1.2-.1-2.3-.1-2.3 0-3.7 1.4-3.7 3.9v2.2H8.5v3H11V21"/></svg>
            <span>
              <span class="follow__link-name" data-i18n="contact.followFb">Facebook</span>
              <span class="follow__link-handle">facebook.com/nelondi</span>
            </span>
            <span class="sr-only" data-i18n="label.newTab"></span>
          </a>
        </div>
      </div>
    </section>

    <section class="section map-section" data-i18n-attr="aria-label:contact.mapTitle" aria-label="Harta e C’era Una Volta në Pazarin e Vjetër, Korçë">
      <div class="container">
        <div class="map">
          <div class="map__frame">
            <iframe
              src="https://www.google.com/maps?q=C%27era+Una+Volta,+Pazari+i+Vjet%C3%ABr,+Kor%C3%A7%C3%AB+7001,+Albania&output=embed"
              data-i18n-attr="title:contact.mapTitle"
              title="Harta e C’era Una Volta në Pazarin e Vjetër, Korçë"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
              allowfullscreen></iframe>
          </div>
          <a class="btn btn--ghost map__cta" data-site-href="maps" href="https://www.google.com/maps?q=place_id:ChIJ6zDr0YgLWhMR49GI8yAOuvs" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 21s-6.5-6.1-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.9 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></svg>
            <span data-i18n="contact.mapCta">Hap në Google Maps</span><span class="sr-only" data-i18n="label.newTab"></span>
          </a>
        </div>
      </div>
    </section>

  </main>

  <script src="js/translations.js" defer></script>
  <script src="js/main.js" defer></script>
</body>
</html>
